[workspace]
resolver = "2"
members = [
    "crates/vortex-core",
    "crates/vortex-evidence",
    "crates/vortex-providers",
    "crates/vortex-service",
    "apps/vortex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Local-first AI reverse-engineering toolkit with evidence-backed static analysis, CLI and MCP interfaces"

[workspace.dependencies]
vortex-core = { path = "crates/vortex-core" }
vortex-evidence = { path = "crates/vortex-evidence" }
vortex-providers = { path = "crates/vortex-providers" }
vortex-service = { path = "crates/vortex-service" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7"
ed25519-dalek = "2"
toml = "0.9"
getrandom = "0.3"
rmcp = { version = "3.5", features = ["client", "transport-io"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
