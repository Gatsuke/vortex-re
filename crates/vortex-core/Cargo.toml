[package]
name = "vortex-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared types, configuration, validation, and error definitions for Vortex-RE"

[dependencies]
toml = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }

# Process-liveness probes for crash recovery (kill(pid, 0)). Pure syscall
# shim, no runtime engine; Unix-only because the probe is a Unix concept.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
